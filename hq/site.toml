# Site HQ (B42, 2026-11-16): the site's own values, defined once.
# Not here: network values (config/pool.<network>.json, written by deploy) and pool rules
# (read from the contract, never typed). Loaded at build time by vite.config.ts as __SITE__;
# a missing key fails the build.

[site]
name = "SAFU"
url = "https://safustaking.com"
icon = "https://safustaking.com/favicon.svg"
wallet_description = "Stake into a SAFU pool and get covered."
# WalletConnect project, allowlisted to the domain above (not a secret: it ships in the page).
walletconnect_project_id = "3824772bb6c01d55a924dac308a3cb3e"

[links]
feedback = "https://docs.google.com/forms/d/1qD9IrIkfs39Wupaw5y-zvCS46Ppq4JQiIsRgV9D3s80/viewform"
x = "https://x.com/safu_staking"
telegram = "https://t.me/+sza3oozmzzJlNzk0"
github = "https://github.com/mrkanchwala"
bd_intake = "https://docs.google.com/forms/d/e/1FAIpQLSefYrJjgxzJrHJe59U7BFottI7KrQMwgiq_txmShbxBBmWk9w/viewform"

[chains]
# The pools this build serves. Only enabled chains are bundled (B42 review A3: a disabled
# chain's code and addresses must never reach the public site).
enabled = ["stellar", "solana"]
default = "stellar"

[chains.labels]
# The switcher's words. Solana label = "solana.testnet" (founder 16 Nov: button text only, no banner).
stellar = "Stellar"
solana = "solana.testnet"

[chains.solana]
# Which Solana cluster's pool the site serves: picks config/solana.<cluster>.json. Must match the claim API's
# SAFU_SOLANA_CLUSTER (deploy_colosseum.sh checks the server's). devnet = the Colosseum SOL pool.
cluster = "devnet"

[guards]
# Strings that must never appear in the built site (checked after every build by scripts/check-dist.mjs).
# The Solana USDC pool (B10) stays hidden until grant news; this is its program id (safu_solana target/idl).
never_ship = ["6nE296ZjUgVifngxv1Z5jWp4xvBexaBiepFHA8UVYC7X"]
# Size budget per built JS file, in KB, uncompressed (CIE P-2, 16 Nov). Set just above today's sizes:
# entry 258 KB, largest chunk 565 KB (the Stellar adapter). Growth past either fails the build; raise one
# only on purpose, in the same commit as the code that needs it.
max_entry_kb = 300
max_chunk_kb = 600
