[package]
name = "covered-registry-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
soroban-sdk = { version = "27.0.0", features = ["testutils"] }

[dependencies.covered-registry]
path = ".."

# The REAL pool, so "coverage = active stake" is checked against the contract
# that ships (same choice as the registry's unit tests).
[dependencies.protection-pool]
path = "../../protection-pool"

[[bin]]
name = "fuzz_registry"
path = "fuzz_targets/fuzz_registry.rs"
test = false
doc = false
bench = false
