[workspace]
resolver = "2"
members = ["protection-pool", "covered-registry", "cctp-common", "cctp-adapter", "safu-account"]

[workspace.package]
license = "Apache-2.0"
edition = "2021"

[workspace.dependencies]
soroban-sdk = "27.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
